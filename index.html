<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Crie sua conta</h1>

            <p class="descricao">
                Preencha os dados para realizar seu cadastro.
            </p>

            <form id="cadastroForm">

                <label for="nome">
                    Nome
                </label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome"
                    maxlength="100"
                    required
                >

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    maxlength="150"
                    required
                >

                <label for="idade">
                    Idade
                </label>

                <input
                    type="number"
                    id="idade"
                    placeholder="Digite sua idade"
                    min="1"
                    max="120"
                    required
                >

                <button type="submit" id="botao">
                    Criar cadastro
                </button>

            </form>

            <div id="mensagem"></div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
